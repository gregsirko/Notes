<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Notes App</title>
    <link rel="stylesheet" href="styles.css" />
    <style></style>
  </head>
  <body>
    <div id="notesTopTools">
      <button id="saveNoteBtn" onclick="saveNote(1)">✅ Save</button>
      <button onclick="deleteNote(1)" class="deleteBtn">❌ Delete</button>
      <button onclick="viewNote(1)" class="viewBtn">👁️ View</button>
      <button onclick="editNote(1)" id="editNoteBtn">✏️ Edit</button>
      <button onclick="newNote(1)" id="editNoteBtn">🆕 New</button>
    </div>
    <div id="noteApp">
      <div id="notesList"></div>
      <div id="notesMain">
        <textarea id="noteInput" placeholder="Write a new note..."></textarea>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
