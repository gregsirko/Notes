<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Notes App</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body,html {
            margin: 0;
            padding: 0;
        }
        * {
            box-sizing: border-box;
            font-family: "Alliance No.1", sans-serif!important;
            color: white;
        }
        body {
            width: 100vw;
            margin: 0px;
            background-color: #111;
            height: 100vh;
        }

        #noteApp {
            max-width: 2200px;
            width: 100%;
            display: flex;
            flex-direction: row;
            height: 95vh;
        }

        #notesList {
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
            width: 250px;
            scroll-behavior: smooth; /* Smooth scrolling for user interaction */
        }

        .note {
            border: 0.05px solid #444;
            padding: 13px 21px;
            text-align: left;
            opacity: 0;  /* Start invisible */
            animation: slideIn 0.111s forwards; /* Animation for sliding in */
            background-color: #111; 
        }

        @keyframes slideIn {
            0% {
                opacity: 1.0;
                transform: translateY(-20px); /* Start from above */
            }
            100% {
                opacity: 1;
                transform: translateY(0); /* End at normal position */
            }
        }

        #notesMain {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            overflow: scroll;
        }

        .noteContent {
            padding: 27px;
            width: 100%;
        }

        #noteTools {
            padding: 17px;
        }

        #notesTopTools {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            height: 5vh;
            padding: 5px;
        }

        .note.highlight {
            background-color: orange; /* Highlighted note background color */
            border-radius: 9px;
            margin: 11px;
            padding: 2px 10px;
        }

        #editNoteBtn:hover,
        #backToListBtn:hover {
            background-color: #0056b3;
        }

        textarea {
            width:100%;
            height: 100%;
            padding: 27px;
            background-color: #1c1c1c;
            border: 0.05px solid #444;
            font-size: 1.3rem;
            line-height: 1.88rem;
        }

        button {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px;
            border-radius: 11px;
            padding: 10px 20px;
            margin: 5px;
            background-color: black;
            color: #fff;
            font-family: San Francisco UT;
            font-weight: 500;
            margin-bottom: 3px;
            font-size: 1.1em;
            border: 1px solid #ccc;
        }

        button:hover {
            background-color: red;
        }

        .padding {
            padding: 10px;
        }

        h4, h5 {
            white-space: nowrap;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 500px;
            font-weight: 600;
        }

        .noteDisplay {
            border: 0.05px solid #444;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-size: 1.3rem;
            width: 100%;
            line-height: 1.88rem;
        }

        .innerNoteTools {
            display: flex;
        }

        @media only screen and (max-width: 609px) {
            button {
                font-size: 11px;
            }
        }

    </style>
</head>
<body>
   <div id="notesTopTools">
        <button id="saveNoteBtn" onclick="saveNote(${note.Id})">✅ Save</button>
        <button onclick="deleteNote(${note.Id})" class="deleteBtn">❌ Delete</button>
        <button onclick="viewNote(${note.Id)" class="viewBtn">👁️ View</button>
        <button onclick="editNote(${note.Id)" id="editNoteBtn">✏️ Edit</button>
        <button onclick="newNote(${note.Id)" id="editNoteBtn">🆕 New</button>
    </div>
    <div id="noteApp">
        <div id="notesList"></div>
        <div id="notesMain">
            <textarea id="noteInput" placeholder="Write a new note..."></textarea>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
